name: OG screenshots

# Renders each page in headless Chromium and commits faithful 1200x630
# preview captures to og/. Runs when page content changes, or on demand.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '**/*.html'
      - 'style.css'
      - 'trust-throughline.js'
      - 'og/screenshot.js'

permissions:
  contents: write

# Don't let overlapping runs race on the same branch.
concurrency:
  group: og-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: node og/screenshot.js

      - name: Commit updated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og/*.png
          if git diff --staged --quiet; then
            echo "No preview changes."
          else
            git commit -m "Update OG screenshots [skip ci]"
            git push origin HEAD:master
          fi
